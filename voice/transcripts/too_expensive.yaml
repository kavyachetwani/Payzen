scenario: too_expensive
description: Customer cancelled mandate because the service costs too much
goal: Offer downgrade or cheaper plan to retain

conversations:
  - id: exp_01
    category: emi
    amount: 15000
    turns:
      - role: agent
        text: "Namaste! Main {brand_name} se bol raha hoon. Aapka ₹{amount} ka EMI mandate cancel hua hai. Kya main jaanaa sakta hoon ki koi issue tha?"
      - role: customer
        text: "Haan, bahut zyada ho gaya monthly. Afford nahi ho raha ab."
      - role: agent
        text: "Main samajh sakta hoon, ₹15,000 monthly kaafi amount hai. Agar aap interested ho toh humare paas ek chhota plan hai — ₹9,000/month mein same features milenge. Kya aap consider karenge?"
      - role: customer
        text: "₹9,000? Hmm... woh toh theek hai actually."
      - role: agent
        text: "Bahut accha! Main aapke liye ₹9,000/month ka plan set kar deta hoon. Naya mandate link aapko SMS pe aa jayega. Dhanyavaad ji!"
    outcome: interested_in_downgrade
    offered_amount: 9000

  - id: exp_02
