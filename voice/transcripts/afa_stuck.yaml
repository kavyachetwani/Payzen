scenario: afa_stuck
description: Customer's payment failed because AFA (Additional Factor Authentication) was not completed
goal: Guide the customer to complete the authentication so the payment can go through

conversations:
  - id: afa_01
    category: emi
    amount: 12000
    turns:
      - role: agent
        text: "Namaste! {brand_name} se bol raha hoon. Aapka ₹{amount} ka EMI payment pending hai — authentication complete nahi hua tha. Kya main help kar sakta hoon?"
      - role: customer
        text: "Kaunsa authentication? Mujhe koi notification nahi mila."
      - role: agent
        text: "Ji, RBI ke rule ke according auto-debit pe ek additional verification hota hai — aapke banking app pe ek approval aata hai. Main abhi ek fresh request bhejta hoon, aap banking app open karke approve kar dena."
      - role: customer
        text: "Accha, banking app pe aayega? Ok main check karta hoon."
      - role: agent
        text: "Haan ji, 2-3 minute mein notification aayega. Approve karte hi payment ho jayega. Dhanyavaad!"
    outcome: completed_auth

  - id: afa_02
