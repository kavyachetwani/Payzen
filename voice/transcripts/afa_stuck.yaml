      - role: agent
        text: "Samajhta hoon ji, pehle ka approval expire ho gaya hoga. Har baar fresh approval chahiye hota hai RBI rules ke according. Main ek naya request bhejta hoon — ek tap mein done ho jayega."
      - role: customer
        text: "Ok bhej do, main abhi kar leta hoon."
      - role: agent
        text: "Bahut accha! Request bhej diya hai. Banking app check kariye — ₹{amount} ka approval aayega. Thank you ji!"
    outcome: completed_auth

  - id: afa_03
    category: sip
    amount: 5000
    turns:
      - role: agent
        text: "Namaste ji! {brand_name} se hoon. Aapka ₹{amount} ka SIP auto-debit fail ho gaya — authentication approve nahi hua tha. Kya main guide kar sakta hoon?"
      - role: customer
        text: "Yeh AFA kya hota hai? Mujhe nahi pata."
      - role: agent
        text: "Simple hai ji — RBI ne rule banaya hai ki auto-debit ke liye aapke banking app pe ek approval aata hai. Jaise UPI PIN daalte ho waise. Bas ek tap karna hota hai."
      - role: customer
        text: "Accha, toh banking app kholna padega?"
      - role: agent
        text: "Haan ji, bas banking app kholo, notifications mein ek pending approval dikhega ₹{amount} ka. Approve karo aur ho gaya!"
      - role: customer
        text: "Ok samajh gaya, kar leta hoon."
      - role: agent
        text: "Perfect! Koi problem aaye toh humein call kar lena. Dhanyavaad ji!"
    outcome: completed_auth

