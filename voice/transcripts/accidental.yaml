  - id: acc_04
    category: insurance
    amount: 2500
    turns:
      - role: agent
        text: "Namaste! {brand_name} insurance se hoon. Aapki premium mandate cancel hui hai. Kya aapne kiya tha?"
      - role: customer
        text: "Mujhe toh pata hi nahi tha! Premium cancel? Policy toh active hai na?"
      - role: agent
        text: "Policy abhi active hai — 30 din ka grace period hota hai. Agar us mein mandate wapas set kar lein toh koi break nahi aayega."
      - role: customer
        text: "Oh thank god. Haan jaldi kar do, policy lapse nahi honi chahiye."
      - role: agent
        text: "Link bhej diya SMS pe. Grace period mein hai toh coverage continuous rahega. Set kar lo aaj hi!"
    outcome: promise_to_pay

