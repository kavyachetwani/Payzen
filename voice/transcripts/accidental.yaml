scenario: accidental
description: Customer cancelled mandate by mistake or didn't intend to
goal: Offer quick re-enrollment with minimal friction

conversations:
  - id: acc_01
    category: emi
    amount: 15000
    turns:
      - role: agent
        text: "Namaste! {brand_name} se hoon. Aapka ₹{amount} ka EMI mandate cancel ho gaya hai. Kya aapne intentionally kiya tha?"
      - role: customer
        text: "Nahi nahi! Galti se ho gaya. Bank app mein kuch aur kar raha tha."
      - role: agent
        text: "Koi baat nahi, hota hai! Main abhi ek naya mandate link bhej deta hoon — ek tap mein wapas set ho jayega. Koi extra charge nahi lagega."
      - role: customer
        text: "Haan please jaldi bhej do, EMI miss nahi hona chahiye."
      - role: agent
        text: "Bhej diya! Link pe tap karo — 2 minute mein done. Next EMI time pe kat jayega. Tension mat lo!"
    outcome: promise_to_pay

  - id: acc_02
    category: subscription
    amount: 499
    turns:
      - role: agent
        text: "Hi! {brand_name} se call. Aapka subscription cancel hua. Kya sab theek hai?"
      - role: customer
        text: "Cancel? Maine toh nahi kiya! Kab hua yeh?"
      - role: agent
        text: "Kal raat 11 baje mandate cancel hua bank end se. Shayad koi banking app update ya accidental touch ho gaya ho."
      - role: customer
        text: "Haan kal raat bank app update kiya tha. Usme ho gaya hoga."
      - role: agent
        text: "Samajh gaya. Link bhej raha hoon — ek click mein wapas active ho jayega. Sab data safe hai."
      - role: customer
        text: "Thanks, abhi kar leta hoon."
      - role: agent
        text: "Great! Agar koi issue ho toh call kar lena. Have a good day!"
    outcome: promise_to_pay

  - id: acc_03
    category: sip
    amount: 5000
